[project]
name = "vgx"
version = "0.1.0"
description = "Reference-aware selective generation: benchmark exploration"
# 3.12 rather than 3.11: vllm's flashinfer dependency annotates
# `array.array[int]`, and array.array only became subscriptable in 3.12, so on
# 3.11 the engine dies at import with "type 'array.array' is not subscriptable".
requires-python = ">=3.12"
dependencies = [
    "rank-bm25>=0.2.2",
    # Capped below 2.3: vllm imports numba (for n-gram speculative decoding) and
    # numba refuses to load against NumPy 2.3+. Note `uv run` re-syncs from this
    # file on every invocation, so a manual `uv pip install numpy<2.3` is undone
    # immediately - the constraint has to live here to hold.
    "numpy>=1.26,<2.3",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# vllm needs CUDA and will not install on macOS. Only the VM installs this,
# which is why vgx.common.llm imports it lazily.
#
# vllm is pinned rather than floating. Current releases ship torch built for
# CUDA 13, which requires an NVIDIA driver >= 580; the A100 VM runs 535
# (CUDA 12.2) and torch then refuses to initialise with "driver is too old".
# CUDA 12.x wheels run fine on a 535 driver under minor-version compatibility,
# so this pins the last release on a cu12 torch. Install with:
#     uv pip install -e ".[gpu]" --torch-backend=cu128
#
# transformers is capped below 5.x for the same reason: vllm 0.11.0 calls
# tokenizer.all_special_tokens_extended, which transformers 5 removed, so an
# unconstrained resolve installs a v5 and every model load dies with
# "Qwen2Tokenizer has no attribute all_special_tokens_extended".
gpu = ["vllm==0.11.0", "transformers>=4.56,<5", "huggingface_hub>=0.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vgx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
