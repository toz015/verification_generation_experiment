[project]
name = "vgx"
version = "0.1.0"
description = "Reference-aware selective generation: benchmark exploration"
requires-python = ">=3.11"
dependencies = [
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# vllm needs CUDA and will not install on macOS. Only the VM installs this,
# which is why vgx.common.llm imports it lazily.
gpu = ["vllm>=0.6", "huggingface_hub>=0.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vgx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
